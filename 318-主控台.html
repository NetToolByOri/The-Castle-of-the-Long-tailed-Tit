<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>作業工具首頁</title>
<style>
:root{color-scheme:dark;--bg:#0b121b;--card:#182736;--card2:#21384b;--edge:#3b5368;--fg:#f2f7fb;--sub:#a9bdcc;--ok:#8ee0bf;--warn:#ffd99a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#203a4d 0,#0b121b 46%);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{width:min(680px,100%);margin:auto;padding:22px 16px 30px}.hero{text-align:center;padding:18px 8px 20px}.hero .mark{font-size:38px;line-height:1}.hero h1{font-size:25px;margin:8px 0 4px}.hero p{margin:0;color:var(--sub)}.home-grid{display:grid;gap:12px}.big-link,.big-button{width:100%;min-height:82px;border:1px solid #4d667a;border-radius:16px;background:var(--card);color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:14px;padding:15px 18px;text-align:left;cursor:pointer;box-shadow:0 5px 18px #0003;transition:.15s transform,.15s background,.15s border-color}.big-link:hover,.big-button:hover{background:var(--card2);transform:translateY(-1px)}.big-link .icon,.big-button .icon{font-size:29px;width:40px;text-align:center;flex:none}.big-link .copy,.big-button .copy{min-width:0;flex:1}.big-link b,.big-button b{display:block;font-size:18px}.big-link small,.big-button small{display:block;color:var(--sub);margin-top:2px}.big-link .go,.big-button .go{font-size:20px;color:#bdd3e2}.big-link.locked{opacity:.48;pointer-events:none}.big-link.ready{border-color:#4c846e}.setup{border-color:#9c7b49}.panel{display:none}.panel.active{display:block}.panel-head{display:flex;align-items:center;gap:10px;margin:3px 0 16px}.back{width:auto;border:1px solid var(--edge);border-radius:10px;background:#172635;color:var(--fg);padding:9px 12px;cursor:pointer}.panel-head h2{margin:0;font-size:20px}section.box{margin:10px 0;padding:14px;border:1px solid var(--edge);border-radius:14px;background:var(--card)}section.box p{margin:5px 0 12px;color:var(--sub)}button,input{font:inherit}button.action{border:1px solid #58738a;border-radius:10px;background:#28465c;color:var(--fg);padding:10px 13px;cursor:pointer}button.action:hover{background:#345d79}button:disabled{opacity:.45;cursor:not-allowed}.status{padding:10px 11px;background:#101c28;border:1px solid #334b61;border-radius:9px;color:var(--sub);white-space:pre-wrap;font-size:13px}.status.ok{color:var(--ok)}.status.err{color:#ff9b9b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}.choices label,#importGroups label{padding:9px;border:1px solid #445b70;border-radius:9px;background:#132332;font-size:13px}.choices input,#importGroups input{accent-color:#88d5b8}.hint{font-size:12px;color:var(--sub)}#importGroups label{display:block;margin:6px 0}#importFile{max-width:100%;font-size:13px}#applyImport{margin-top:8px;background:#2b7054}.meta{text-align:center;font-size:11px;color:#7890a2;margin-top:20px}@media(max-width:520px){main{padding:14px 12px 24px}.hero{padding-top:12px}.big-link,.big-button{min-height:78px;padding:13px 15px}.choices{grid-template-columns:1fr}}
</style></head><body><main>
<div id="homeView">
  <header class="hero"><div class="mark">🥦</div><h1>作業工具首頁</h1><p>選擇要使用的功能</p></header>
  <div class="home-grid" aria-label="工具入口">
    <a class="big-link locked" data-tool href="316-PersonnelRosterManager.html" aria-disabled="true"><span class="icon">👥</span><span class="copy"><b>基礎人事系統</b><small>人員資料與建置管理</small></span><span class="go">🔒</span></a>
    <a class="big-link locked" data-tool href="315-休假作業管制工具.html" aria-disabled="true"><span class="icon">🏝️</span><span class="copy"><b>休假管制系統</b><small>休假紀錄與作業管制</small></span><span class="go">🔒</span></a>
    <a class="big-link locked" data-tool href="313-DutyTool.html" aria-disabled="true"><span class="icon">📋</span><span class="copy"><b>值星輔助系統</b><small>勤務與值星作業輔助</small></span><span class="go">🔒</span></a>
    <button class="big-button setup" type="button" data-open="databaseView"><span class="icon">🧰</span><span class="copy"><b>IndexedDB 建立工具</b><small>第一次使用時先建立共用資料庫</small></span><span class="go">›</span></button>
    <button class="big-button" type="button" data-open="backupView"><span class="icon">💾</span><span class="copy"><b>資料備份及匯入</b><small>匯出備份或還原既有資料</small></span><span class="go">›</span></button>
  </div>
  <p class="meta" id="origin"></p>
</div>
<div class="panel" id="databaseView"><div class="panel-head"><button class="back" type="button">← 首頁</button><h2>IndexedDB 建立工具</h2></div><section class="box"><p>第一次使用請先建立共用資料庫。已有的資料會保留，不會被清空。</p><div class="status" id="dbStatus">正在檢查…</div><div class="row"><button class="action" id="initDb">建立／檢查共用資料庫</button><button class="action" id="recheckDb">重新檢查</button></div></section></div>
<div class="panel" id="backupView"><div class="panel-head"><button class="back" type="button">← 首頁</button><h2>資料備份及匯入</h2></div><section class="box"><h3>匯出備份</h3><p>選擇要備份的資料。</p><div class="choices" id="exportGroups"><label><input type="checkbox" value="personnel" checked> 基礎人事</label><label><input type="checkbox" value="leave" checked> 休假資料</label><label><input type="checkbox" value="duty" checked> 值星資料</label><label><input type="checkbox" value="island" checked> 共用島休／外宿</label></div><button class="action" id="exportBtn" disabled>匯出勾選資料（JSON）</button><p class="hint">備份檔可用於同一站點還原，也可在本機與 GitHub 站點間搬移。</p></section><section class="box"><h3>匯入資料</h3><p>選擇先前匯出的 JSON 備份檔。</p><div class="row"><input type="file" id="importFile" accept=".json,application/json"></div><div id="importGroups"></div><button class="action" id="applyImport" disabled>還原勾選資料</button><p class="hint">還原會取代所選資料。操作前請先關閉其他工具頁面。</p><div class="status" id="backupStatus">尚未選擇備份檔。</div></section></div>
<script>
(()=>{'use strict';
const MG='OracleShion:Management',OP='OracleShion:Operations',NAMES={personnel:['people','personnelConfig','personnelOrders'],leave:['leaveRecords','leaveConfig'],duty:['dutyDays','dutySettings'],island:['islandRecords']},STORE_DB={people:MG,personnelConfig:MG,personnelOrders:MG,leaveRecords:OP,leaveConfig:OP,dutyDays:OP,dutySettings:OP,islandRecords:OP},PK={people:'id',personnelConfig:'key',personnelOrders:'key',leaveRecords:'id',leaveConfig:'key',dutyDays:'id',dutySettings:'key',islandRecords:'id'},LABEL={personnel:'基礎人事',leave:'休假資料',duty:'值星資料',island:'正式島休／外宿'},$=id=>document.getElementById(id);let ready=false,loaded=null,busy=false;
$('origin').textContent=location.host||'本機來源';
 function showView(id){$('homeView').style.display=id?'none':'block';document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo(0,0)}
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showView(b.dataset.open));document.querySelectorAll('.back').forEach(b=>b.onclick=()=>showView(''));
function status(id,text,error=false){const x=$(id);x.textContent=text;x.className='status '+(error?'err':'ok')}
function gates(value){ready=value;document.querySelectorAll('[data-tool]').forEach(a=>{a.classList.toggle('locked',!value);a.classList.toggle('ready',value);a.setAttribute('aria-disabled',String(!value));a.lastElementChild.textContent=value?'›':'🔒'});$('exportBtn').disabled=!value;$('applyImport').disabled=!value||!loaded||busy}
function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('資料庫要求失敗'))})}
function open(name,upgrade=false){return new Promise((resolve,reject)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{if(!upgrade){r.transaction.abort();return}const db=r.result,names=name===MG?['people','personnelConfig','personnelOrders','meta']:['meta','leaveRecords','leaveConfig','islandRecords','dutyDays','dutySettings'];for(const store of names)if(!db.objectStoreNames.contains(store))db.createObjectStore(store,{keyPath:PK[store]||'key'});if(name===MG){const people=r.transaction.objectStore('people');if(!people.indexNames.contains('departmentId'))people.createIndex('departmentId','departmentId')}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('開啟資料庫失敗'));r.onblocked=()=>reject(Error('另一個工具仍占用資料庫，請關閉後再試'))})}
async function isInitialized(){if(typeof indexedDB.databases==='function'){const list=await indexedDB.databases();if(![MG,OP].every(n=>list.some(d=>d.name===n)))return false}let dbs;try{dbs=[];dbs.push(await open(MG));dbs.push(await open(OP))}catch{dbs?.forEach(db=>db.close());return false}try{if(!['people','personnelConfig','personnelOrders','meta'].every(n=>dbs[0].objectStoreNames.contains(n))||!['meta','leaveRecords','leaveConfig','islandRecords','dutyDays','dutySettings'].every(n=>dbs[1].objectStoreNames.contains(n)))return false;const values=await Promise.all(dbs.map(db=>req(db.transaction('meta').objectStore('meta').get('initialized:318'))));return values.every(Boolean)}finally{dbs.forEach(db=>db.close())}}
async function check(){try{const yes=await isInitialized();gates(yes);status('dbStatus',yes?'✓ 共用資料庫已建立，可以開始使用。':'尚未建立共用資料庫。請點下方按鈕完成初始化。',false)}catch(e){gates(false);status('dbStatus','檢查失敗：'+e.message,true)}}
async function initialize(){if(busy)return;busy=true;$('initDb').disabled=true;try{for(const name of [MG,OP]){const db=await open(name,true);try{const missing=(name===MG?['people','personnelConfig','personnelOrders','meta']:['meta','leaveRecords','leaveConfig','islandRecords','dutyDays','dutySettings']).filter(n=>!db.objectStoreNames.contains(n));if(missing.length)throw Error(name+' 缺少資料表 '+missing.join(','));await new Promise((resolve,reject)=>{const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({key:'initialized:318',createdAt:new Date().toISOString()});tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('建立標記失敗'))})}finally{db.close()}}await check()}catch(e){gates(false);status('dbStatus','建立失敗：'+e.message,true)}finally{busy=false;$('initDb').disabled=false}}
$('initDb').onclick=initialize;$('recheckDb').onclick=check;
function selected(container){return [...$(container).querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value)}
async function readStores(stores){const byDb={};for(const store of stores)(byDb[STORE_DB[store]]??=[]).push(store);const result={};for(const [name,list] of Object.entries(byDb)){const db=await open(name);try{await new Promise((resolve,reject)=>{const tx=db.transaction(list,'readonly');for(const n of list)tx.objectStore(n).getAll().onsuccess=e=>{result[n]=e.target.result};tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('讀取中止'))})}finally{db.close()}}return result}
function groupsToStores(groups){return [...new Set(groups.flatMap(g=>NAMES[g]||[]))]}
function saveFile(obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='作業工具-資料備份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportBtn').onclick=async()=>{const groups=selected('exportGroups');if(!groups.length){status('backupStatus','請至少勾選一個資料層。',true);return}if(!ready)return;$('exportBtn').disabled=true;try{const stores=await readStores(groupsToStores(groups));saveFile({format:'OracleShion.ConsoleBackup',version:1,exportedAt:new Date().toISOString(),groups,stores});status('backupStatus','已產生 '+groups.map(g=>LABEL[g]).join('、')+' 的 JSON 備份。')}catch(e){status('backupStatus','匯出失敗：'+e.message,true)}finally{$('exportBtn').disabled=!ready}};
function validatePack(pack){if(!pack||pack.format!=='OracleShion.ConsoleBackup'||pack.version!==1||!Array.isArray(pack.groups)||!pack.stores||typeof pack.stores!=='object'||Array.isArray(pack.stores))throw Error('不是相容的備份檔');const groups=[...new Set(pack.groups)];if(!groups.length||groups.some(g=>!NAMES[g]))throw Error('備份資料層不正確');for(const store of groupsToStores(groups)){const list=pack.stores[store],key=PK[store];if(!Array.isArray(list))throw Error('缺少 '+store+' 資料表');const keys=new Set();for(const row of list){if(!row||typeof row!=='object'||Array.isArray(row)||typeof row[key]!=='string'||!row[key]||keys.has(row[key]))throw Error(store+' 的主鍵無效或重複');keys.add(row[key])}}return groups}
async function convertInput(source){if(source?.format==='OracleShion.ConsoleBackup')return source;
 if(source?.format==='OracleShion.LeaveOperationControl.Export'&&source.version===1&&source.data&&Array.isArray(source.data.people)){const {people,...config}=source.data;return{format:'OracleShion.ConsoleBackup',version:1,exportedAt:source.exportedAt||'',groups:['leave'],stores:{leaveRecords:people,leaveConfig:[{key:'main',value:config}]}}}
 if(source?.format==='OracleShion.DutyBundle'&&source.version===1&&source.schedule?.days&&Array.isArray(source.islandRecords)){const saved=await readStores(['dutySettings']),templates=saved.dutySettings[0]?.value?.duties||[],days=Object.entries(source.schedule.days).map(([id,value])=>({id,value}));for(const day of days)for(const record of day.value?.duties||[]){if(record.dutyIndex==null)continue;const matches=templates.map((t,i)=>!t.systemKey&&t.name===record.name?i:-1).filter(i=>i>=0);if(matches.length!==1)throw Error('舊班表的「'+(record.name||'未命名')+'」無法唯一對應目前勤務設定，請先補齊設定再還原');record.dutyIndex=matches[0]}return{format:'OracleShion.ConsoleBackup',version:1,exportedAt:source.exportedAt||'',groups:['duty','island'],stores:{dutyDays:days,dutySettings:saved.dutySettings,islandRecords:source.islandRecords}}}
 throw Error('不是相容的備份，或無法辨識的舊版 JSON；不支援直接讀取舊 localStorage 或加密檔案')}
$('importFile').onchange=async e=>{loaded=null;$('applyImport').disabled=true;try{const file=e.target.files[0];if(!file){$('importGroups').innerHTML='';return}const pack=await convertInput(JSON.parse(await file.text())),groups=validatePack(pack);loaded=pack;$('importGroups').innerHTML='<div class="hint">可還原的資料層：</div>'+groups.map(g=>`<label><input type="checkbox" value="${g}" checked> ${LABEL[g]}（${NAMES[g].map(n=>pack.stores[n].length).join('＋')} 筆）</label>`).join('');$('applyImport').disabled=!ready;status('backupStatus','已讀取備份：'+(pack.exportedAt||'未標時間')+'。請檢查勾選後再還原。')}catch(err){$('importGroups').innerHTML='';status('backupStatus','讀取失敗：'+err.message,true)}};
function validateRelations(candidate){const ids=new Set(candidate.people.map(p=>p.id));for(const r of candidate.leaveRecords)if(r.personId&&!ids.has(r.personId))throw Error('休假紀錄 '+r.id+' 的人員 ID 不在人事清冊');for(const r of candidate.islandRecords)if(!ids.has(r.personId))throw Error('島休紀錄 '+r.id+' 的人員 ID 不在人事清冊')}
async function restoreOne(name,stores,pack){const db=await open(name);try{await new Promise((resolve,reject)=>{const tx=db.transaction([...stores,'meta'],'readwrite'),meta=tx.objectStore('meta'),leaseKey=name===MG?'lease:personnel':'writer',old=meta.get(leaseKey);old.onsuccess=()=>{const lease=old.result||{};meta.put({...lease,key:leaseKey,owner:'318-'+crypto.randomUUID(),epoch:(lease.epoch||0)+1,revision:(lease.revision||0)+1,heartbeatAt:Date.now()});for(const store of stores){const target=tx.objectStore(store);target.clear();for(const row of pack.stores[store])target.put(row)}};tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('還原交易中止'))})}finally{db.close()}}
$('applyImport').onclick=async()=>{if(!ready||!loaded||busy)return;const groups=selected('importGroups');if(!groups.length){status('backupStatus','請至少勾選一個還原資料層。',true);return}let stores,previous,committed=[];try{stores=groupsToStores(groups);previous=await readStores(Object.keys(PK));const combined={...previous,...Object.fromEntries(stores.map(n=>[n,loaded.stores[n]]))};validateRelations(combined);if(!confirm('確定以備份檔取代 '+groups.map(g=>LABEL[g]).join('、')+'？請先關閉其他工具頁面；其他開啟中的視窗會失去寫入權。'))return;busy=true;$('applyImport').disabled=true;$('exportBtn').disabled=true;const mg=stores.filter(n=>STORE_DB[n]===MG),op=stores.filter(n=>STORE_DB[n]===OP);if(mg.length){await restoreOne(MG,mg,loaded);committed.push([MG,mg])}if(op.length){await restoreOne(OP,op,loaded);committed.push([OP,op])}status('backupStatus','✓ 已還原 '+groups.map(g=>LABEL[g]).join('、')+'。請重新開啟工具。');await check()}catch(e){let result='';for(const [db,part] of committed.reverse())try{await restoreOne(db,part,{stores:previous});result='；已回復先前完成的資料層'}catch(rollbackError){result='；回復失敗：'+rollbackError.message+'。請勿繼續使用，先以備份檔重新還原'}status('backupStatus','還原未完成：'+e.message+result+'。請重新檢查資料後再操作。',true)}finally{busy=false;$('applyImport').disabled=!ready||!loaded;$('exportBtn').disabled=!ready}};
check();
})();
</script></body></html>
